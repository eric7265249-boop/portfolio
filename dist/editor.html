<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chao — 网站编辑器</title><link rel="stylesheet" href="refinement.css"><link rel="stylesheet" href="editor.css"></head><body class="site-editor"><header class="editor-top"><a href="index.html" target="_blank" class="editor-brand">Chao <span>网站编辑器</span></a><span id="save-status" role="status">正在读取网站…</span><div><button id="undo-edit" disabled title="撤销上一步">撤销 ↶</button><button id="preview-mode" aria-pressed="false">预览</button><button id="export-site">导出网站 ↓</button><button id="save-site" class="primary">保存到网站</button></div></header><div class="editor-layout"><aside class="editor-sidebar"><div class="sidebar-heading"><span>WEBSITE / 页面</span></div><nav id="page-list" aria-label="选择编辑页面"></nav><div class="sidebar-heading secondary"><span>本页内容</span><div class="inventory-tabs"><button data-inventory="blocks" class="active">模块</button><button data-inventory="images">图片</button><button data-inventory="text">文字</button></div></div><input id="inventory-search" placeholder="搜索本页内容" aria-label="搜索本页内容"><div id="inventory-list"></div><div class="editor-help"><strong>直接点选，开始编辑。</strong><p>点选画面中的文字或图片。文字可双击原位修改；图片可上传替换。预览模式可以正常浏览链接。</p><span id="storage-mode">正在检查保存方式…</span><a href="acid-lab.html" target="_blank">查看五版酸性动态 ↗</a></div></aside><main class="editor-workspace"><div class="editor-canvas-toolbar"><div><button data-width="desktop" class="active" aria-label="电脑宽度">电脑</button><button data-width="tablet" aria-label="平板宽度">平板</button><button data-width="mobile" aria-label="手机宽度">手机</button></div><span id="current-page-name">主页</span><a id="open-page" href="index.html" target="_blank">单独打开 ↗</a></div><div class="editor-canvas"><iframe id="site-preview" title="可编辑网站预览" src="about:blank"></iframe></div><div class="editor-bottom"><span>选中元素后，在右侧修改。保存与导出会保留图片和文字。</span><button id="reset-all">恢复全部原始内容</button></div></main><aside class="editor-inspector"><div id="empty-inspector"><span>INSPECTOR</span><h1>把它变成<br>你的表达。</h1><p>在画面中点选一项内容，<br>或从左侧列表中选择。</p></div><form id="inspector-form" hidden onsubmit="return false"><div class="inspector-title"><small id="selection-kind">文字</small><h2 id="selection-name">选中内容</h2><span id="shared-note" hidden>此项将同步所有页面</span></div><fieldset id="text-properties"><label>文字内容<div id="rich-text" contenteditable="true" role="textbox" aria-label="修改选中的文字" aria-multiline="true"></div></label><div class="rich-tools"><button type="button" data-format="bold"><b>B</b></button><button type="button" data-format="italic"><i>I</i></button><button type="button" data-format="underline"><u>U</u></button><button type="button" id="plain-text">清除格式</button></div><div class="field-row"><label>字号（px）<input id="font-size" type="number" min="6" max="400"></label><label>文字颜色<input id="text-color" type="color" value="#ffffff"></label></div><label>对齐<select id="text-align"><option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option><option value="justify">两端对齐</option></select></label></fieldset><fieldset id="image-properties" hidden><img id="selected-image-preview" alt="选中图片的缩略预览"><label class="upload-button">上传替换图片<input id="image-upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"></label><p class="field-hint">支持 JPG、PNG、WebP、GIF、SVG，最大 25 MB。替换后默认完整显示。</p><label>图片说明<input id="image-alt" type="text"></label><label>图片显示方式<select id="image-fit"><option value="original">保留原稿裁切</option><option value="contain">完整显示</option><option value="cover">填满画面</option></select></label></fieldset><fieldset id="link-properties" hidden><label>链接地址<input id="link-href" type="text" placeholder="https://、mailto: 或站内页面"></label></fieldset><fieldset id="module-properties" hidden><label>所在模块<span id="selected-module"></span></label><div class="field-row"><button type="button" id="move-up">模块上移 ↑</button><button type="button" id="move-down">模块下移 ↓</button>
